<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>비디오 압축기 - 프라이버시 보호</title>
  <!-- ffmpeg.wasm 래퍼: same-origin 벤더링 필수 (Worker가 cross-origin URL을 열 수 없어서) -->
  <script src="vendor/ffmpeg/ffmpeg.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      line-height: 1.6;
      color: #1a1a2e;
      background: #f0f4f8;
      min-height: 100vh;
    }
    .container { max-width: 800px; margin: 0 auto; padding: 2rem 1rem; }
    header { text-align: center; margin-bottom: 2rem; }
    h1 { font-size: 2rem; font-weight: 800; color: #1a1a2e; }
    .privacy-badge {
      display: inline-block;
      background: #10b981;
      color: white;
      padding: 0.4rem 1rem;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-top: 0.75rem;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      margin-bottom: 1.5rem;
    }
    .drop-zone {
      border: 2px dashed #cbd5e1;
      border-radius: 12px;
      padding: 3rem 2rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .drop-zone:hover, .drop-zone.dragover {
      border-color: #3b82f6;
      background: #eff6ff;
    }
    .drop-zone-icon { font-size: 3rem; margin-bottom: 1rem; }
    .drop-zone-text { color: #64748b; font-size: 1rem; }
    .drop-zone-hint { color: #94a3b8; font-size: 0.85rem; margin-top: 0.5rem; }
    .file-info {
      display: none;
      margin-top: 1.5rem;
      padding: 1rem;
      background: #f8fafc;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
    }
    .file-info.visible { display: block; }
    .file-info-row {
      display: flex;
      justify-content: space-between;
      padding: 0.4rem 0;
      font-size: 0.9rem;
    }
    .file-info-label { color: #64748b; }
    .file-info-value { font-weight: 600; color: #1a1a2e; }
    .codec-selector { margin-top: 1.5rem; }
    .codec-selector label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      color: #475569;
      margin-bottom: 0.5rem;
    }
    .codec-selector select {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 1rem;
      background: white;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .codec-selector select:focus {
      outline: none;
      border-color: #3b82f6;
    }
    .btn {
      display: inline-block;
      padding: 0.85rem 2rem;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn-primary {
      background: #3b82f6;
      color: white;
      width: 100%;
      margin-top: 1.5rem;
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(59,130,246,0.3); }
    .btn-primary:disabled { background: #94a3b8; cursor: not-allowed; transform: none; box-shadow: none; }
    .progress-section { display: none; }
    .progress-section.visible { display: block; }
    .progress-bar-bg {
      background: #e2e8f0;
      border-radius: 50px;
      height: 12px;
      overflow: hidden;
      margin: 1rem 0;
    }
    .progress-bar-fill {
      background: linear-gradient(90deg, #3b82f6, #8b5cf6);
      height: 100%;
      width: 0%;
      border-radius: 50px;
      transition: width 0.3s;
    }
    .progress-text { text-align: center; color: #64748b; font-size: 0.9rem; }
    .progress-time { text-align: center; color: #94a3b8; font-size: 0.8rem; margin-top: 0.25rem; }
    .result-section { display: none; }
    .result-section.visible { display: block; }
    .result-success {
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      border-radius: 10px;
      padding: 1rem;
      text-align: center;
      margin-bottom: 1rem;
    }
    .result-success h3 { color: #059669; margin-bottom: 0.5rem; }
    .result-compare {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin: 1rem 0;
    }
    .result-box {
      background: #f8fafc;
      border-radius: 10px;
      padding: 1rem;
      text-align: center;
    }
    .result-box-label { font-size: 0.8rem; color: #64748b; }
    .result-box-value { font-size: 1.5rem; font-weight: 800; color: #1a1a2e; }
    .result-box-value.compressed { color: #10b981; }
    .btn-download {
      background: #10b981;
      color: white;
      width: 100%;
      margin-top: 1rem;
    }
    .btn-download:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(16,185,129,0.3); }
    .btn-new {
      background: #e2e8f0;
      color: #475569;
      width: 100%;
      margin-top: 0.75rem;
    }
    .error-message {
      display: none;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 10px;
      padding: 1rem;
      color: #dc2626;
      margin-top: 1rem;
      font-size: 0.9rem;
    }
    .error-message.visible { display: block; }
    .loading-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255,255,255,0.9);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }
    .loading-overlay.visible { display: flex; }
    .loading-spinner {
      width: 50px; height: 50px;
      border: 4px solid #e2e8f0;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: #475569; font-weight: 600; }
  </style>
</head>
<body>
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner"></div>
    <div class="loading-text" id="loadingText">ffmpeg.wasm 로드 중...</div>
  </div>

  <div class="container">
    <header>
      <h1>비디오 압축기</h1>
      <div class="privacy-badge">서버 업로드 없음 · 브라우저에서만 처리</div>
    </header>

    <div class="card">
      <div class="drop-zone" id="dropZone">
        <div class="drop-zone-icon">📹</div>
        <div class="drop-zone-text">비디오 파일을 드래그하거나 클릭하여 선택</div>
        <div class="drop-zone-hint">MP4, WebM, MOV 등 · 파일은 서버에 업로드되지 않습니다</div>
      </div>
      <input type="file" id="fileInput" accept="video/*" style="display:none;">

      <div class="file-info" id="fileInfo">
        <div class="file-info-row">
          <span class="file-info-label">파일명</span>
          <span class="file-info-value" id="fileName">-</span>
        </div>
        <div class="file-info-row">
          <span class="file-info-label">크기</span>
          <span class="file-info-value" id="fileSize">-</span>
        </div>
        <div class="file-info-row">
          <span class="file-info-label">길이</span>
          <span class="file-info-value" id="fileDuration">-</span>
        </div>
        <div class="file-info-row">
          <span class="file-info-label">해상도</span>
          <span class="file-info-value" id="fileResolution">-</span>
        </div>
      </div>

      <div class="codec-selector">
        <label for="codecSelect">코덱 선택</label>
        <select id="codecSelect">
          <option value="h264" selected>H.264 · MP4 (최고 호환성)</option>
          <option value="vp9">VP9 · WebM (더 좋은 압축률)</option>
        </select>
      </div>

      <button class="btn btn-primary" id="compressBtn" disabled>압축 시작</button>

      <div class="error-message" id="errorMessage"></div>
    </div>

    <div class="card progress-section" id="progressSection">
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressBar"></div>
      </div>
      <div class="progress-text" id="progressText">준비 중...</div>
      <div class="progress-time" id="progressTime"></div>
    </div>

    <div class="card result-section" id="resultSection">
      <div class="result-success">
        <h3>압축 완료!</h3>
        <p id="resultSummary"></p>
      </div>
      <div class="result-compare">
        <div class="result-box">
          <div class="result-box-label">원본 크기</div>
          <div class="result-box-value" id="originalSize">-</div>
        </div>
        <div class="result-box">
          <div class="result-box-label">압축 후 크기</div>
          <div class="result-box-value compressed" id="compressedSize">-</div>
        </div>
      </div>
      <button class="btn btn-download" id="downloadBtn">다운로드</button>
      <button class="btn btn-new" id="newFileBtn">새 파일 압축</button>
    </div>
  </div>

  <script>
    // === 상수 ===
    const TARGET_SIZE_MB = 49.9;
    const TARGET_SIZE_BITS = TARGET_SIZE_MB * 1024 * 1024 * 8;
    const AUDIO_BITRATE = 128000;

    // === 코덱 설정 ===
    // @ffmpeg/core 0.12.6에는 libaom-av1이 없다(-encoders로 확인).
    // 실제로 존재하는 인코더만 노출한다: libx264, libvpx-vp9.
    const CODEC_PRESETS = {
      h264: { codec: 'libx264', ext: 'mp4', mime: 'video/mp4', extraArgs: ['-preset', 'veryfast'] },
      vp9: { codec: 'libvpx-vp9', ext: 'webm', mime: 'video/webm', extraArgs: ['-row-mt', '1', '-deadline', 'realtime', '-cpu-used', '8'] }
    };

    // === DOM 요소 ===
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const compressBtn = document.getElementById('compressBtn');
    const fileInfo = document.getElementById('fileInfo');
    const errorMessage = document.getElementById('errorMessage');
    const progressSection = document.getElementById('progressSection');
    const progressBar = document.getElementById('progressBar');
    const progressText = document.getElementById('progressText');
    const progressTime = document.getElementById('progressTime');
    const resultSection = document.getElementById('resultSection');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const loadingText = document.getElementById('loadingText');

    let selectedFile = null;
    let ffmpegInstance = null;

    // === ffmpeg.wasm 로드 ===
    // 래퍼(vendor/ffmpeg/*.js)는 same-origin에 있고, 코어(30MB)는 CDN에서 불러온다.
    // importScripts()는 cross-origin을 허용하므로 coreURL은 CDN 그대로 써도 된다.
    const CORE_BASE = 'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/umd';

    let loadPromise = null;

    async function loadFFmpeg() {
      if (ffmpegInstance) return ffmpegInstance;
      if (loadPromise) return loadPromise;

      loadPromise = (async () => {
        if (typeof FFmpegWASM === 'undefined') {
          throw new Error('내장 파일 vendor/ffmpeg/ffmpeg.js 를 불러오지 못했습니다.');
        }

        const ffmpeg = new FFmpegWASM.FFmpeg();

        ffmpeg.on('log', ({ message }) => console.log('[ffmpeg]', message));

        await ffmpeg.load({
          coreURL: CORE_BASE + '/ffmpeg-core.js',
          wasmURL: CORE_BASE + '/ffmpeg-core.wasm'
        });

        ffmpegInstance = ffmpeg;
        return ffmpeg;
      })();

      return loadPromise;
    }

    function getFFmpeg() {
      return ffmpegInstance;
    }

    function getSelectedCodec() {
      const select = document.getElementById('codecSelect');
      return select ? select.value : 'av1';
    }

    function getExtension(filename) {
      const match = filename.match(/\.[^.]+$/);
      return match ? match[0] : '.mp4';
    }

    // === 로딩 오버레이 ===
    function showLoading(message) {
      loadingText.textContent = message;
      loadingOverlay.classList.add('visible');
    }

    function hideLoading() {
      loadingOverlay.classList.remove('visible');
    }

    // === 파일 선택 + 드래그앤드롭 ===
    dropZone.addEventListener('click', () => fileInput.click());

    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('dragover');
    });

    dropZone.addEventListener('dragleave', () => {
      dropZone.classList.remove('dragover');
    });

    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      const files = e.dataTransfer.files;
      if (files.length > 0) {
        handleFileSelect(files[0]);
      }
    });

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        handleFileSelect(e.target.files[0]);
      }
    });

    async function handleFileSelect(file) {
      if (!file.type.startsWith('video/')) {
        showError('비디오 파일을 선택해 주세요.');
        return;
      }
      selectedFile = file;
      hideError();
      document.getElementById('fileName').textContent = file.name;
      document.getElementById('fileSize').textContent = formatFileSize(file.size);
      fileInfo.classList.add('visible');
      compressBtn.disabled = true;

      if (file.size <= TARGET_SIZE_MB * 1024 * 1024) {
        showError('이미 파일 크기가 49.9MB 이하입니다. 압축이 필요하지 않습니다.');
        compressBtn.textContent = '원본 다운로드';
        compressBtn.disabled = false;
        compressBtn.onclick = () => downloadOriginal(file);
        return;
      }

      compressBtn.textContent = '압축 시작';

      try {
        const meta = await probeVideo(file);
        document.getElementById('fileDuration').textContent = formatTime(meta.duration);
        document.getElementById('fileResolution').textContent = meta.width + ' × ' + meta.height;
        compressBtn.disabled = false;
      } catch (err) {
        showError(errText(err));
        fileInfo.classList.remove('visible');
      }
    }

    function showError(msg) {
      errorMessage.textContent = msg;
      errorMessage.classList.add('visible');
    }

    function hideError() {
      errorMessage.classList.remove('visible');
    }

    // ffmpeg.wasm 0.12.x rejects with a plain string (not an Error), so
    // err.message is undefined and the real reason gets lost.
    function errText(err) {
      if (err == null) return '알 수 없는 오류';
      if (typeof err === 'string') return err.replace(/^Error:\s*/, '');
      if (err.message) return err.message;
      return String(err);
    }

    function formatFileSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
      return (bytes / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
    }

    function formatTime(seconds) {
      if (!isFinite(seconds)) return '-';
      const h = Math.floor(seconds / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      const s = Math.floor(seconds % 60);
      if (h > 0) return h + '시간 ' + m + '분 ' + s + '초';
      if (m > 0) return m + '분 ' + s + '초';
      return s + '초';
    }

    function downloadOriginal(file) {
      const url = URL.createObjectURL(file);
      const a = document.createElement('a');
      a.href = url;
      a.download = file.name;
      a.click();
      URL.revokeObjectURL(url);
    }

    // === 비디오 분석 (ffmpeg probe) ===
    async function probeVideo(file) {
      const ffmpeg = getFFmpeg();
      if (!ffmpeg) throw new Error('ffmpeg이 로드되지 않았습니다.');

      const inputName = 'input' + getExtension(file.name);
      const data = await file.arrayBuffer();
      await ffmpeg.writeFile(inputName, new Uint8Array(data));

      let probeOutput = '';
      const logHandler = ({ message }) => { probeOutput += message + '\n'; };
      ffmpeg.on('log', logHandler);

      try {
        await ffmpeg.exec(['-i', inputName, '-f', 'null', '-']);
      } catch (e) {
        // ffmpeg probe는 실패해도 로그에서 메타데이터를 추출할 수 있음
      }

      ffmpeg.off('log', logHandler);

      const durationMatch = probeOutput.match(/Duration: (\d{2}):(\d{2}):(\d{2}\.\d{2})/);
      const videoMatch = probeOutput.match(/Video: .*? (\d{3,5})x(\d{3,5}).*? (\d+(?:\.\d+)?) fps/);

      await ffmpeg.deleteFile(inputName).catch(() => {});

      if (!durationMatch || !videoMatch) {
        throw new Error('비디오 메타데이터를 추출할 수 없습니다. 지원하지 않는 포맷일 수 있습니다.');
      }

      const hours = parseInt(durationMatch[1]);
      const minutes = parseInt(durationMatch[2]);
      const seconds = parseFloat(durationMatch[3]);
      const duration = hours * 3600 + minutes * 60 + seconds;

      const width = parseInt(videoMatch[1]);
      const height = parseInt(videoMatch[2]);
      const frameRate = parseFloat(videoMatch[3]) || 30;

      return { duration, width, height, frameRate };
    }

    // === 비트레이트 계산 ===
    function calculateBitrate(durationSeconds) {
      if (durationSeconds <= 0 || !isFinite(durationSeconds)) {
        throw new Error('비디오 길이를 확인할 수 없습니다.');
      }
      const videoBitrate = Math.floor((TARGET_SIZE_BITS / durationSeconds) - AUDIO_BITRATE);
      return Math.max(100000, Math.min(videoBitrate, 20000000));
    }

    // === 진행률 업데이트 ===
    function updateProgress(percent, elapsedSeconds, totalFrames, processedFrames) {
      progressBar.style.width = percent + '%';
      progressText.textContent = '인코딩 중... ' + percent.toFixed(1) + '%';

      if (elapsedSeconds > 0 && processedFrames > 0) {
        const fps = processedFrames / elapsedSeconds;
        const remaining = Math.ceil((totalFrames - processedFrames) / fps);
        progressTime.textContent = '예상 남은 시간: ' + formatTime(remaining);
      }
    }

    // === ffmpeg 인코딩 ===
    async function compressVideo(file, onProgress) {
      const ffmpeg = getFFmpeg();
      if (!ffmpeg) throw new Error('ffmpeg이 로드되지 않았습니다.');

      const meta = await probeVideo(file);
      const bitrate = calculateBitrate(meta.duration);
      const codecKey = getSelectedCodec();
      const preset = CODEC_PRESETS[codecKey];

      const inputName = 'input' + getExtension(file.name);
      const outputName = 'output.' + preset.ext;

      const data = await file.arrayBuffer();
      await ffmpeg.writeFile(inputName, new Uint8Array(data));

      let startTime = performance.now();
      let lastProgressTime = 0;

      ffmpeg.on('progress', ({ progress, time }) => {
        const now = performance.now();
        if (now - lastProgressTime > 100) {
          lastProgressTime = now;
          const elapsed = (now - startTime) / 1000;
          const pct = Math.min(100, progress * 100);
          onProgress(pct, elapsed, 100, Math.floor(pct));
        }
      });

      const args = [
        '-hwaccel', 'auto',
        '-i', inputName,
        '-c:v', preset.codec,
        '-b:v', bitrate.toString(),
        '-c:a', 'aac',
        '-b:a', '128k',
        ...preset.extraArgs,
        '-y',
        outputName
      ];

      await ffmpeg.exec(args);

      const outputData = await ffmpeg.readFile(outputName);
      const blob = new Blob([outputData], { type: preset.mime });

      await ffmpeg.deleteFile(inputName).catch(() => {});
      await ffmpeg.deleteFile(outputName).catch(() => {});

      return blob;
    }

    // === 결과 표시 ===
    function showResult(originalFile, compressedBlob) {
      progressSection.classList.remove('visible');
      resultSection.classList.add('visible');

      const originalSize = originalFile.size;
      const compressedSize = compressedBlob.size;
      const ratio = ((1 - compressedSize / originalSize) * 100).toFixed(1);

      document.getElementById('resultSummary').textContent = '파일 크기가 ' + ratio + '% 줄었습니다.';
      document.getElementById('originalSize').textContent = formatFileSize(originalSize);
      document.getElementById('compressedSize').textContent = formatFileSize(compressedSize);

      const downloadBtn = document.getElementById('downloadBtn');
      downloadBtn.onclick = () => {
        const url = URL.createObjectURL(compressedBlob);
        const a = document.createElement('a');
        a.href = url;
        const ext = CODEC_PRESETS[getSelectedCodec()].ext;
        a.download = originalFile.name.replace(/\.[^.]+$/, '') + '_compressed.' + ext;
        a.click();
        URL.revokeObjectURL(url);
      };

      document.getElementById('newFileBtn').onclick = () => {
        resultSection.classList.remove('visible');
        fileInfo.classList.remove('visible');
        compressBtn.disabled = true;
        compressBtn.textContent = '압축 시작';
        selectedFile = null;
        fileInput.value = '';
      };
    }

    // === 압축 버튼 이벤트 ===
    compressBtn.addEventListener('click', async () => {
      if (!selectedFile) return;

      compressBtn.disabled = true;
      progressSection.classList.add('visible');
      resultSection.classList.remove('visible');

      try {
        const resultBlob = await compressVideo(selectedFile, updateProgress);
        showResult(selectedFile, resultBlob);
      } catch (err) {
        showError('압축 실패: ' + errText(err));
        compressBtn.disabled = false;
      }
    });

    // === 초기화: ffmpeg.wasm 로드 ===
    showLoading('ffmpeg.wasm 로드 중... (최초 1회, ~30MB)');
    loadFFmpeg()
      .then(() => {
        hideLoading();
        console.log('ffmpeg.wasm 로드 완료');
      })
      .catch(err => {
        hideLoading();
        console.error('ffmpeg.wasm 로드 실패:', err);
        showError('ffmpeg.wasm 로드 실패: ' + errText(err));
      });
  </script>
