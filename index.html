<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>비디오 압축기 - 프라이버시 보호</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      line-height: 1.6;
      color: #1a1a2e;
      background: #f0f4f8;
      min-height: 100vh;
    }
    .container { max-width: 800px; margin: 0 auto; padding: 2rem 1rem; }
    header { text-align: center; margin-bottom: 2rem; }
    h1 { font-size: 2rem; font-weight: 800; color: #1a1a2e; }
    .privacy-badge {
      display: inline-block;
      background: #10b981;
      color: white;
      padding: 0.4rem 1rem;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-top: 0.75rem;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      margin-bottom: 1.5rem;
    }
    .drop-zone {
      border: 2px dashed #cbd5e1;
      border-radius: 12px;
      padding: 3rem 2rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .drop-zone:hover, .drop-zone.dragover {
      border-color: #3b82f6;
      background: #eff6ff;
    }
    .drop-zone-icon { font-size: 3rem; margin-bottom: 1rem; }
    .drop-zone-text { color: #64748b; font-size: 1rem; }
    .drop-zone-hint { color: #94a3b8; font-size: 0.85rem; margin-top: 0.5rem; }
    .file-info {
      display: none;
      margin-top: 1.5rem;
      padding: 1rem;
      background: #f8fafc;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
    }
    .file-info.visible { display: block; }
    .file-info-row {
      display: flex;
      justify-content: space-between;
      padding: 0.4rem 0;
      font-size: 0.9rem;
    }
    .file-info-label { color: #64748b; }
    .file-info-value { font-weight: 600; color: #1a1a2e; }
    .btn {
      display: inline-block;
      padding: 0.85rem 2rem;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn-primary {
      background: #3b82f6;
      color: white;
      width: 100%;
      margin-top: 1.5rem;
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(59,130,246,0.3); }
    .btn-primary:disabled { background: #94a3b8; cursor: not-allowed; transform: none; box-shadow: none; }
    .progress-section { display: none; }
    .progress-section.visible { display: block; }
    .progress-bar-bg {
      background: #e2e8f0;
      border-radius: 50px;
      height: 12px;
      overflow: hidden;
      margin: 1rem 0;
    }
    .progress-bar-fill {
      background: linear-gradient(90deg, #3b82f6, #8b5cf6);
      height: 100%;
      width: 0%;
      border-radius: 50px;
      transition: width 0.3s;
    }
    .progress-text { text-align: center; color: #64748b; font-size: 0.9rem; }
    .progress-time { text-align: center; color: #94a3b8; font-size: 0.8rem; margin-top: 0.25rem; }
    .result-section { display: none; }
    .result-section.visible { display: block; }
    .result-success {
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      border-radius: 10px;
      padding: 1rem;
      text-align: center;
      margin-bottom: 1rem;
    }
    .result-success h3 { color: #059669; margin-bottom: 0.5rem; }
    .result-compare {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin: 1rem 0;
    }
    .result-box {
      background: #f8fafc;
      border-radius: 10px;
      padding: 1rem;
      text-align: center;
    }
    .result-box-label { font-size: 0.8rem; color: #64748b; }
    .result-box-value { font-size: 1.5rem; font-weight: 800; color: #1a1a2e; }
    .result-box-value.compressed { color: #10b981; }
    .btn-download {
      background: #10b981;
      color: white;
      width: 100%;
      margin-top: 1rem;
    }
    .btn-download:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(16,185,129,0.3); }
    .btn-new {
      background: #e2e8f0;
      color: #475569;
      width: 100%;
      margin-top: 0.75rem;
    }
    .codec-selector {
      margin-top: 1.5rem;
    }
    .codec-selector label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      color: #475569;
      margin-bottom: 0.5rem;
    }
    .codec-selector select {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 1rem;
      background: white;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .codec-selector select:focus {
      outline: none;
      border-color: #3b82f6;
    }
    .codec-hw-support {
      margin-top: 0.5rem;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .codec-hw-support.supported {
      color: #10b981;
    }
    .codec-hw-support.unsupported {
      color: #f59e0b;
    }
    .codec-hw-support.unknown {
      color: #94a3b8;
    }
    .error-message {
      display: none;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 10px;
      padding: 1rem;
      color: #dc2626;
      margin-top: 1rem;
      font-size: 0.9rem;
    }
    .error-message.visible { display: block; }
    .browser-warning {
      display: none;
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 10px;
      padding: 1rem;
      color: #d97706;
      margin-bottom: 1rem;
      font-size: 0.9rem;
    }
    .browser-warning.visible { display: block; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>비디오 압축기</h1>
      <div class="privacy-badge">서버 업로드 없음 · 브라우저에서만 처리</div>
    </header>

    <div class="browser-warning" id="browserWarning">
      현재 브라우저는 AV1 인코딩을 지원하지 않습니다. Chrome 94+ 또는 Edge 94+를 사용해 주세요.
    </div>

    <div class="card">
      <div class="drop-zone" id="dropZone">
        <div class="drop-zone-icon">📹</div>
        <div class="drop-zone-text">비디오 파일을 드래그하거나 클릭하여 선택</div>
        <div class="drop-zone-hint">MP4, WebM, MOV 등 · 파일은 서버에 업로드되지 않습니다</div>
      </div>
      <input type="file" id="fileInput" accept="video/*" style="display:none;">

      <div class="file-info" id="fileInfo">
        <div class="file-info-row">
          <span class="file-info-label">파일명</span>
          <span class="file-info-value" id="fileName">-</span>
        </div>
        <div class="file-info-row">
          <span class="file-info-label">크기</span>
          <span class="file-info-value" id="fileSize">-</span>
        </div>
        <div class="file-info-row">
          <span class="file-info-label">길이</span>
          <span class="file-info-value" id="fileDuration">-</span>
        </div>
        <div class="file-info-row">
          <span class="file-info-label">해상도</span>
          <span class="file-info-value" id="fileResolution">-</span>
        </div>
      </div>

      <div class="codec-selector">
        <label for="codecSelect">코덱 선택</label>
        <select id="codecSelect">
          <option value="av1" selected>AV1 (최고 압축률)</option>
          <option value="vp9">VP9 (빠른 인코딩)</option>
          <option value="h264">H.264 (최고 호환성)</option>
        </select>
        <div class="codec-hw-support" id="codecHwSupport"></div>
      </div>

      <button class="btn btn-primary" id="compressBtn" disabled>압축 시작</button>

      <div class="error-message" id="errorMessage"></div>
    </div>

    <div class="card progress-section" id="progressSection">
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressBar"></div>
      </div>
      <div class="progress-text" id="progressText">준비 중...</div>
      <div class="progress-time" id="progressTime"></div>
    </div>

    <div class="card result-section" id="resultSection">
      <div class="result-success">
        <h3>압축 완료!</h3>
        <p id="resultSummary"></p>
      </div>
      <div class="result-compare">
        <div class="result-box">
          <div class="result-box-label">원본 크기</div>
          <div class="result-box-value" id="originalSize">-</div>
        </div>
        <div class="result-box">
          <div class="result-box-label">압축 후 크기</div>
          <div class="result-box-value compressed" id="compressedSize">-</div>
        </div>
      </div>
      <button class="btn btn-download" id="downloadBtn">다운로드</button>
      <button class="btn btn-new" id="newFileBtn">새 파일 압축</button>
    </div>
  </div>

  <script>
    // === 상수 ===
    const TARGET_SIZE_MB = 49.9;
    const TARGET_SIZE_BITS = TARGET_SIZE_MB * 1024 * 1024 * 8;
    const AUDIO_BITRATE = 128000; // 128 kbps

    // === DOM 요소 ===
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const compressBtn = document.getElementById('compressBtn');
    const fileInfo = document.getElementById('fileInfo');
    const errorMessage = document.getElementById('errorMessage');
    const progressSection = document.getElementById('progressSection');
    const progressBar = document.getElementById('progressBar');
    const progressText = document.getElementById('progressText');
    const progressTime = document.getElementById('progressTime');
    const resultSection = document.getElementById('resultSection');

    let selectedFile = null;

    // === 코덱 설정 ===
    const CODEC_PRESETS = {
      av1: { codec: 'av01.0.04M.08', ext: 'webm', mime: 'video/webm' },
      vp9: { codec: 'vp09.00.10.08', ext: 'webm', mime: 'video/webm' },
      h264: { codec: 'avc1.42001E', ext: 'mp4', mime: 'video/mp4' }
    };

    function getSelectedCodec() {
      const select = document.getElementById('codecSelect');
      return select ? select.value : 'av1';
    }

    async function checkCodecSupport(codecKey) {
      if (typeof VideoEncoder === 'undefined') return { supported: false, hw: false };
      const preset = CODEC_PRESETS[codecKey];
      try {
        const result = await VideoEncoder.isConfigSupported({
          codec: preset.codec,
          width: 1920,
          height: 1080,
          bitrate: 1000000,
          framerate: 30
        });
        return { supported: result.supported, hw: result.supported && !result.config?.hwAccelerated === false };
      } catch {
        return { supported: false, hw: false };
      }
    }

    function updateHwIndicator(supported, hw) {
      const el = document.getElementById('codecHwSupport');
      if (!el) return;
      el.classList.remove('supported', 'unsupported', 'unknown');
      if (!supported) {
        el.textContent = '이 브라우저에서는 지원되지 않습니다';
        el.classList.add('unsupported');
      } else if (hw) {
        el.textContent = '하드웨어 인코딩 지원됨';
        el.classList.add('supported');
      } else {
        el.textContent = '소프트웨어 인코딩만 지원됨';
        el.classList.add('unknown');
      }
    }

    // === 브라우저 지원 확인 ===
    async function checkBrowserSupport() {
      if (typeof VideoEncoder === 'undefined' || typeof VideoDecoder === 'undefined') {
        document.getElementById('browserWarning').classList.add('visible');
        compressBtn.disabled = true;
        return false;
      }

      // 선택된 코덱 지원 여부 확인
      const selectedCodec = getSelectedCodec();
      const { supported, hw } = await checkCodecSupport(selectedCodec);

      updateHwIndicator(supported, hw);

      if (!supported) {
        document.getElementById('browserWarning').textContent =
          '현재 브라우저는 선택한 코덱(' + selectedCodec.toUpperCase() + ')을 지원하지 않습니다. 다른 코덱을 선택해 주세요.';
        document.getElementById('browserWarning').classList.add('visible');
        compressBtn.disabled = true;
        return false;
      }

      return true;
    }

    // === 파일 선택 + 드래그앤드롭 ===
    dropZone.addEventListener('click', () => fileInput.click());

    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('dragover');
    });

    dropZone.addEventListener('dragleave', () => {
      dropZone.classList.remove('dragover');
    });

    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      const files = e.dataTransfer.files;
      if (files.length > 0) {
        handleFileSelect(files[0]);
      }
    });

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        handleFileSelect(e.target.files[0]);
      }
    });

    async function handleFileSelect(file) {
      if (!file.type.startsWith('video/')) {
        showError('비디오 파일을 선택해 주세요.');
        return;
      }
      selectedFile = file;
      hideError();
      document.getElementById('fileName').textContent = file.name;
      document.getElementById('fileSize').textContent = formatFileSize(file.size);
      fileInfo.classList.add('visible');
      compressBtn.disabled = true;

      // 이미 타겟 크기 이하인 경우
      if (file.size <= TARGET_SIZE_MB * 1024 * 1024) {
        showError('이미 파일 크기가 49.9MB 이하입니다. 압축이 필요하지 않습니다.');
        compressBtn.textContent = '원본 다운로드';
        compressBtn.disabled = false;
        compressBtn.onclick = () => downloadOriginal(file);
        return;
      }

      compressBtn.textContent = '압축 시작';

      try {
        const meta = await analyzeVideo(file);
        document.getElementById('fileDuration').textContent = formatTime(meta.duration);
        document.getElementById('fileResolution').textContent = meta.width + ' × ' + meta.height;
        compressBtn.disabled = false;
      } catch (err) {
        showError(err.message);
        fileInfo.classList.remove('visible');
      }
    }

    function showError(msg) {
      errorMessage.textContent = msg;
      errorMessage.classList.add('visible');
    }

    function hideError() {
      errorMessage.classList.remove('visible');
    }

    function formatFileSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
      return (bytes / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
    }

    function formatTime(seconds) {
      if (!isFinite(seconds)) return '-';
      const h = Math.floor(seconds / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      const s = Math.floor(seconds % 60);
      if (h > 0) return h + '시간 ' + m + '분 ' + s + '초';
      if (m > 0) return m + '분 ' + s + '초';
      return s + '초';
    }

    function downloadOriginal(file) {
      const url = URL.createObjectURL(file);
      const a = document.createElement('a');
      a.href = url;
      a.download = file.name;
      a.click();
      URL.revokeObjectURL(url);
    }

    // === 비디오 분석 ===
    async function analyzeVideo(file) {
      const arrayBuffer = await file.arrayBuffer();
      const blob = new Blob([arrayBuffer], { type: file.type });
      const url = URL.createObjectURL(blob);

      return new Promise((resolve, reject) => {
        const video = document.createElement('video');
        video.preload = 'metadata';
        video.muted = true;
        video.playsInline = true;

        video.onloadedmetadata = () => {
          const result = {
            duration: video.duration,
            width: video.videoWidth,
            height: video.videoHeight,
            frameRate: 30
          };
          URL.revokeObjectURL(url);
          resolve(result);
        };

        video.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error('비디오를 불러올 수 없습니다. 지원하지 않는 포맷일 수 있습니다.'));
        };

        video.src = url;
      });
    }

    // === 비트레이트 계산 ===
    function calculateBitrate(durationSeconds) {
      if (durationSeconds <= 0 || !isFinite(durationSeconds)) {
        throw new Error('비디오 길이를 확인할 수 없습니다.');
      }
      const videoBitrate = Math.floor((TARGET_SIZE_BITS / durationSeconds) - AUDIO_BITRATE);
      return Math.max(100000, Math.min(videoBitrate, 20000000));
    }

    // === 진행률 업데이트 ===
    function updateProgress(percent, elapsedSeconds, totalFrames, processedFrames) {
      progressBar.style.width = percent + '%';
      progressText.textContent = '인코딩 중... ' + percent.toFixed(1) + '% (' + processedFrames + '/' + totalFrames + ' 프레임)';

      if (processedFrames > 0 && elapsedSeconds > 0) {
        const fps = processedFrames / elapsedSeconds;
        const remaining = Math.ceil((totalFrames - processedFrames) / fps);
        progressTime.textContent = '예상 남은 시간: ' + formatTime(remaining);
      }
    }

    // === AV1 인코딩 ===
    async function compressVideo(file, onProgress) {
      const arrayBuffer = await file.arrayBuffer();
      const meta = await analyzeVideo(file);
      const bitrate = calculateBitrate(meta.duration);

      const blob = new Blob([arrayBuffer], { type: file.type });
      const url = URL.createObjectURL(blob);
      const video = document.createElement('video');
      video.muted = true;
      video.playsInline = true;
      video.src = url;

      await new Promise((resolve, reject) => {
        video.onloadeddata = resolve;
        video.onerror = () => reject(new Error('비디오 로딩 실패'));
      });

      const canvas = document.createElement('canvas');
      canvas.width = meta.width;
      canvas.height = meta.height;
      const ctx = canvas.getContext('2d');

      const fps = meta.frameRate || 30;
      const totalFrames = Math.floor(meta.duration * fps);
      const frameInterval = 1 / fps;

      const encodedChunks = [];

      const encoder = new VideoEncoder({
        output: (chunk) => {
          encodedChunks.push(chunk);
        },
        error: (e) => {
          throw e;
        }
      });

      const codecKey = getSelectedCodec();
      const preset = CODEC_PRESETS[codecKey];

      encoder.configure({
        codec: preset.codec,
        width: meta.width,
        height: meta.height,
        bitrate: bitrate,
        framerate: fps,
        latencyMode: 'quality'
      });

      let frameCount = 0;
      const startTime = performance.now();
      let nextKeyFrame = 0;
      const keyFrameInterval = Math.floor(fps * 2);

      try {
        // 비디오를 1배속 재생하면서 requestVideoFrameCallback으로 프레임 수신
        video.play();

        await new Promise((resolve, reject) => {
          const processFrame = (now, metadata) => {
            if (frameCount >= totalFrames || video.ended || video.paused) {
              resolve();
              return;
            }

            try {
              ctx.drawImage(video, 0, 0, meta.width, meta.height);
              const frame = new VideoFrame(canvas, { timestamp: metadata.mediaTime * 1000000 });

              const isKeyFrame = frameCount >= nextKeyFrame;
              if (isKeyFrame) nextKeyFrame += keyFrameInterval;

              encoder.encode(frame, { keyFrame: isKeyFrame });
              frame.close();

              frameCount++;
              const elapsed = (performance.now() - startTime) / 1000;
              const percent = (frameCount / totalFrames) * 100;
              onProgress(percent, elapsed, totalFrames, frameCount);
            } catch (err) {
              reject(err);
              return;
            }

            video.requestVideoFrameCallback(processFrame);
          };

          video.requestVideoFrameCallback(processFrame);

          video.onerror = () => reject(new Error('비디오 재생 중 오류가 발생했습니다.'));
          video.onended = () => resolve();
        });
      } catch (err) {
        encoder.close();
        URL.revokeObjectURL(url);
        if (err.message && (err.message.includes('memory') || err.name === 'QuotaExceededError')) {
          throw new Error('메모리가 부족하여 압축을 완료할 수 없습니다. 더 짧은 비디오로 시도해 주세요.');
        }
        throw err;
      }

      await encoder.flush();
      encoder.close();
      URL.revokeObjectURL(url);

      return new Blob(encodedChunks, { type: 'video/webm' });
    }

    // === 결과 표시 ===
    function showResult(originalFile, compressedBlob) {
      progressSection.classList.remove('visible');
      resultSection.classList.add('visible');

      const originalSize = originalFile.size;
      const compressedSize = compressedBlob.size;
      const ratio = ((1 - compressedSize / originalSize) * 100).toFixed(1);

      document.getElementById('resultSummary').textContent = '파일 크기가 ' + ratio + '% 줄었습니다.';
      document.getElementById('originalSize').textContent = formatFileSize(originalSize);
      document.getElementById('compressedSize').textContent = formatFileSize(compressedSize);

      const downloadBtn = document.getElementById('downloadBtn');
      downloadBtn.onclick = () => {
        const url = URL.createObjectURL(compressedBlob);
        const a = document.createElement('a');
        a.href = url;
        const ext = CODEC_PRESETS[getSelectedCodec()].ext;
        a.download = originalFile.name.replace(/\.[^.]+$/, '') + '_compressed.' + ext;
        a.click();
        URL.revokeObjectURL(url);
      };

      document.getElementById('newFileBtn').onclick = () => {
        resultSection.classList.remove('visible');
        fileInfo.classList.remove('visible');
        compressBtn.disabled = true;
        compressBtn.textContent = '압축 시작';
        selectedFile = null;
        fileInput.value = '';
      };
    }

    // === 압축 버튼 이벤트 ===
    compressBtn.addEventListener('click', async () => {
      if (!selectedFile) return;

      compressBtn.disabled = true;
      progressSection.classList.add('visible');
      resultSection.classList.remove('visible');

      try {
        const resultBlob = await compressVideo(selectedFile, updateProgress);
        showResult(selectedFile, resultBlob);
      } catch (err) {
        showError('압축 중 오류가 발생했습니다: ' + err.message);
        compressBtn.disabled = false;
      }
    });

    // === 코덱 변경 시 지원 여부 재확인 ===
    document.getElementById('codecSelect').addEventListener('change', () => {
      document.getElementById('browserWarning').classList.remove('visible');
      checkBrowserSupport();
    });

    // === 초기화 ===
    checkBrowserSupport();
  </script>
</body>
</html>
